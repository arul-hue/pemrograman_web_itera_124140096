<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loop, Fungsi &amp; Event Handler</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Loop, Fungsi &amp; Event Handler</h1>

  <!-- Hasil loop dan latihan ditampilkan di sini -->
  <div id="result"></div>

  <hr>
  <!-- Demo event handler -->
  <div class="kotak">
    <h2>Demo Event Handler</h2>
    <input type="text" id="nama-input" placeholder="Masukkan nama Kalian">
    <button id="sapa-button">Sapa Saya</button>
    <div id="sapa-output"></div>

    <h3>Kalkulator Sederhana</h3>
    <input type="number" id="angka1" placeholder="Angka 1">
    <input type="number" id="angka2" placeholder="Angka 2">
    <div>
      <button id="btn-tambah">+</button>
      <button id="btn-kurang">-</button>
      <button id="btn-kali">&times;</button>
      <button id="btn-bagi">&divide;</button>
    </div>
    <div id="hasil-kalkulator"></div>
  </div>

  <!-- Latihan: kalkulator BMI -->
  <div class="kotak">
    <h2>Latihan: Kalkulator BMI</h2>
    <input type="number" id="berat" placeholder="Berat (kg)">
    <input type="number" id="tinggi" placeholder="Tinggi (cm)">
    <button id="btn-bmi">Hitung BMI</button>
    <div id="hasil-bmi"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
