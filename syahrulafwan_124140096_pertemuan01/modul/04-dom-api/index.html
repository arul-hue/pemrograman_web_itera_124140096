<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manipulasi DOM &amp; Fetch API</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <h1>Manipulasi DOM &amp; Fetch API</h1>
  <button id="btn-dark">Dark Mode</button>

  <!-- Demo manipulasi DOM -->
  <div class="kotak">
    <h2>Demo Manipulasi DOM</h2>
    <div id="dom-output"></div>
    <button id="btn-tambah-item">Tambah Item</button>
    <button id="btn-hapus-item">Hapus Item</button>
    <button id="btn-ubah-warna">Ubah Warna</button>
  </div>

  <!-- Demo Fetch API + latihan search dan pagination -->
  <div class="kotak">
    <h2>Demo Fetch API</h2>
    <button id="btn-fetch">Ambil Data</button>
    <input type="text" id="input-cari" placeholder="Cari berdasarkan title...">
    <div id="api-output"></div>
    <div id="kontrol-halaman">
      <button id="btn-prev">Previous</button>
      <span id="info-halaman"></span>
      <button id="btn-next">Next</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
